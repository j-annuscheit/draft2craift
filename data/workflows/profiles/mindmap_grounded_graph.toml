schema_version = 1
profile_id = "mindmap_grounded_graph"
workflow_id = "mindmap_agentic"
profile_version = "3.1.0"
description = "Deterministic seed, incremental frontier expansion, repair path and gap-fill loop for grounded mindmaps."

[policy]
max_runtime_seconds = 300
max_llm_calls = 32

map_min_nodes = 2
map_max_nodes = 160
map_max_edges = 320
map_max_depth = 12
map_require_single_root = true
map_allow_cycles = false
map_max_isolated_nodes = 0
map_require_connected_graph = true
map_node_min_word_letters = 3

map_seed_concept_limit = 12
map_seed_enrichment_enabled = true
map_seed_enrichment_limit = 3

map_frontier_evidence_limit = 5
map_local_candidate_limit = 8
map_llm_child_limit = 4
map_max_frontier_visits_per_node = 2
map_max_children_per_node = 6
map_max_expansion_rounds = 24

map_gap_fill_enabled = true
map_gap_limit = 4
map_max_gap_rounds = 6

[model_routing]
"mindmap.propose_seed_enrichment" = "llm.default"
"mindmap.propose_child_nodes" = "llm.default"
"mindmap.propose_gap_fill" = "llm.default"

[cache_policy]
enabled = true
default_ttl_seconds = 180

[cache_policy.per_tool_ttl_seconds]
"llm.generate" = 0

[wiring]
"mindmap.resolve_request" = "map.resolve_request.v1"
"mindmap.collect_context" = "map.collect_context.v1"
"mindmap.normalize_context" = "map.normalize_context.v1"
"mindmap.segment_context" = "map.segment_context.v1"
"mindmap.extract_outline" = "map.extract_outline.v1"
"mindmap.score_focus_sections" = "map.score_focus_sections.v1"
"mindmap.choose_root_label" = "map.choose_root_label.v1"
"mindmap.seed_from_outline" = "map.seed_from_outline.v1"
"mindmap.extract_seed_concepts" = "map.extract_seed_concepts.v1"
"mindmap.propose_seed_enrichment" = "map.propose_seed_enrichment.v1"
"mindmap.parse_seed_enrichment" = "map.parse_seed_enrichment.v1"
"mindmap.validate_seed_enrichment" = "map.validate_seed_enrichment.v1"
"mindmap.commit_initial_tree" = "map.commit_initial_tree.v1"
"mindmap.select_frontier_node" = "map.select_frontier_node.v1"
"mindmap.collect_frontier_evidence" = "map.collect_frontier_evidence.v1"
"mindmap.extract_local_candidates" = "map.extract_local_candidates.v1"
"mindmap.propose_child_nodes" = "map.propose_child_nodes.v1"
"mindmap.parse_child_nodes" = "map.parse_child_nodes.v1"
"mindmap.repair_child_nodes" = "map.repair_child_nodes.v1"
"mindmap.validate_child_nodes" = "map.validate_child_nodes.v1"
"mindmap.attach_child_nodes" = "map.attach_child_nodes.v1"
"mindmap.detect_coverage_gaps" = "map.detect_coverage_gaps.v1"
"mindmap.select_gap_target" = "map.select_gap_target.v1"
"mindmap.propose_gap_fill" = "map.propose_gap_fill.v1"
"mindmap.parse_gap_fill" = "map.parse_gap_fill.v1"
"mindmap.validate_gap_fill" = "map.validate_gap_fill.v1"
"mindmap.attach_gap_fill" = "map.attach_gap_fill.v1"
"mindmap.validate_candidate_tree" = "map.validate_candidate_tree.v1"
"mindmap.commit_candidate_tree" = "map.commit_candidate_tree.v1"
"mindmap.update_coverage" = "map.update_coverage.v1"
"mindmap.decide_continue_expansion" = "map.decide_continue_expansion.v1"
"mindmap.normalize_labels" = "map.normalize_labels.v1"
"mindmap.merge_semantic_duplicates" = "map.merge_semantic_duplicates.v1"
"mindmap.ensure_single_root" = "map.ensure_single_root.v1"
"mindmap.ensure_connected_tree" = "map.ensure_connected_tree.v1"
"mindmap.validate_final_tree" = "map.validate_final_tree.v1"
"mindmap.render_markdown" = "map.render_markdown.v1"
"mindmap.emit_result" = "map.emit_result.v1"
