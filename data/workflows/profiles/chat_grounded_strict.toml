schema_version = 1
profile_id = "chat_grounded_strict"
workflow_id = "chat_agentic"
profile_version = "1.0.0"
description = "Grounded chat with strict citation expectations."

[policy]
max_runtime_seconds = 90
max_llm_calls = 12
chat_top_k = 5

[model_routing]
"chat.draft_answer" = "llm.default"

[cache_policy]
enabled = true
default_ttl_seconds = 120

[wiring]
"chat.classify_intent" = "chat.classify_user_intent.v1"
"chat.plan_retrieval" = "chat.plan_retrieval.v1"
"chat.retrieve_candidates" = "chat.retrieve_candidates.v1"
"chat.draft_answer" = "chat.draft_answer_with_citations.v1"
"chat.quality_gate" = "chat.quality_gate.citations.v1"
"chat.emit_response" = "chat.emit_response.v1"
