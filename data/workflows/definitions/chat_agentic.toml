schema_version = 1
workflow_id = "chat_agentic"
workflow_version = "1.0.0"
job_type = "chat"
entry_step = "classify_intent"
terminal_steps = ["emit_response", "fail_hard"]

[state_init]
intent = {}
retrieval_plan = {}
retrieval_hits = []
draft_answer = {}
quality_gate = {}

[projections.classify_intent_input_v1]
include = ["request.question"]

[projections.plan_retrieval_input_v1]
include = ["request.question", "policy.chat_top_k"]

[projections.retrieve_candidates_input_v1]
include = ["state.retrieval_plan"]

[projections.draft_answer_input_v1]
include = ["request.question", "state.retrieval_hits"]

[projections.quality_gate_input_v1]
include = ["state.draft_answer"]

[projections.emit_response_input_v1]
include = ["state.draft_answer", "state.quality_gate"]

[[steps]]
id = "classify_intent"
runner = "chat.classify_user_intent.v1"
input_projection = "classify_intent_input_v1"
write_to = "intent"
on_error = "continue_with_defaults"

[[steps]]
id = "plan_retrieval"
runner = "chat.plan_retrieval.v1"
input_projection = "plan_retrieval_input_v1"
write_to = "retrieval_plan"
on_error = "continue_with_defaults"

[[steps]]
id = "retrieve_candidates"
runner = "chat.retrieve_candidates.v1"
input_projection = "retrieve_candidates_input_v1"
write_to = "retrieval_hits"
on_error = "continue_with_empty_evidence"

[[steps]]
id = "draft_answer"
runner = "chat.draft_answer_with_citations.v1"
input_projection = "draft_answer_input_v1"
write_to = "draft_answer"
on_error = "continue_with_defaults"

[[steps]]
id = "quality_gate"
runner = "chat.quality_gate.citations.v1"
input_projection = "quality_gate_input_v1"
write_to = "quality_gate"
on_error = "continue_with_defaults"

[[steps]]
id = "emit_response"
runner = "chat.emit_response.v1"
input_projection = "emit_response_input_v1"

[[steps]]
id = "fail_hard"
runner = "control.fail.v1"

[[edges]]
from = "classify_intent"
to = "plan_retrieval"
color = "#27ae60"

[[edges]]
from = "plan_retrieval"
to = "retrieve_candidates"
color = "#27ae60"

[[edges]]
from = "retrieve_candidates"
to = "draft_answer"
color = "#27ae60"

[[edges]]
from = "draft_answer"
to = "quality_gate"
color = "#27ae60"

[[edges]]
from = "quality_gate"
to = "emit_response"
color = "#27ae60"

[budgets]
max_runtime_seconds = 120
max_llm_calls = 16
max_rag_calls = 8
max_nli_calls = 8

[step_tool_allowlist]
retrieve_candidates = ["rag.search"]
draft_answer = ["llm.generate"]
