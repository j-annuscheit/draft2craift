schema_version = 1
workflow_id = "mindmap_agentic"
workflow_version = "3.1.0"
job_type = "mindmap"
entry_step = "resolve_request"
terminal_steps = ["emit_result", "fail_hard"]

[state_init]
map_request = {}
map_source = {}
map_segments = {}
map_outline = {}
map_focus = {}
map_seed = {}
map_seed_concepts = {}
map_seed_enrichment = {}
map_frontier = {}
map_evidence = {}
map_candidate_hints = {}
map_candidate = {}
map_validation = {}
map_gaps = {}
map_gap = {}
map_coverage = { covered_segment_ids = [], coverage_ratio = 0.0, total_segments = 0 }
map_result = {}
map_metrics = { frontier_visits = {}, candidate_commits = 0, candidate_discards = 0, expansion_round = 0, gap_round = 0 }

[projections.resolve_request_input_v1]
include = ["request.query", "request.mode", "request.depth"]

[projections.collect_context_input_v1]
include = ["request.context_text"]

[projections.normalize_context_input_v1]
include = ["state.map_source.context_text"]

[projections.segment_context_input_v1]
include = ["state.map_source.normalized_text"]

[projections.extract_outline_input_v1]
include = ["state.map_source.normalized_text", "state.map_segments.segments"]

[projections.score_focus_sections_input_v1]
include = ["state.map_request.focus", "state.map_segments.segments", "state.map_outline"]

[projections.choose_root_label_input_v1]
include = ["state.map_request.focus", "state.map_outline.title"]

[projections.seed_from_outline_input_v1]
include = ["state.map_seed.root_label", "state.map_outline", "state.map_focus"]

[projections.extract_seed_concepts_input_v1]
include = [
  "state.map_segments.segments",
  "state.map_focus.top_segments",
  "policy.map_seed_concept_limit",
]

[projections.propose_seed_enrichment_input_v1]
include = [
  "state.map_seed.root_label",
  "state.map_result.markdown",
  "state.map_seed_concepts.concepts",
  "state.map_segments.segments",
  "state.map_focus.top_segments",
  "state.map_request.focus",
  "state.map_source.normalized_text",
  "policy.map_seed_enrichment_enabled",
  "policy.map_seed_enrichment_limit",
]

[projections.parse_seed_enrichment_input_v1]
include = [
  "state.map_seed_enrichment.raw_text",
  "state.map_seed_enrichment.reason",
  "state.map_focus.top_segments",
  "policy.map_node_min_word_letters",
  "policy.map_seed_enrichment_limit",
]

[projections.validate_seed_enrichment_input_v1]
include = [
  "state.map_seed_enrichment.nodes",
  "state.map_seed_enrichment.reason",
  "state.map_result.markdown",
  "state.map_seed.root_label",
  "state.map_segments.segments",
  "state.map_focus.top_segments",
  "state.map_source.normalized_text",
  "policy.map_node_min_word_letters",
  "policy.map_seed_enrichment_limit",
]

[projections.commit_initial_tree_input_v1]
include = [
  "state.map_result",
  "state.map_seed.root_label",
  "state.map_validation.accepted_nodes",
  "state.map_focus.top_segments",
  "state.map_segments.segment_count",
]

[projections.select_frontier_node_input_v1]
include = [
  "state.map_result.markdown",
  "state.map_request.focus",
  "state.map_request.target_depth",
  "state.map_metrics.frontier_visits",
  "policy.map_max_frontier_visits_per_node",
  "policy.map_max_children_per_node",
]

[projections.collect_frontier_evidence_input_v1]
include = [
  "state.map_frontier",
  "state.map_segments.segments",
  "state.map_focus.top_segments",
  "state.map_request.focus",
  "policy.map_frontier_evidence_limit",
]

[projections.extract_local_candidates_input_v1]
include = [
  "state.map_result.markdown",
  "state.map_frontier.node_id",
  "state.map_evidence",
  "policy.map_local_candidate_limit",
]

[projections.propose_child_nodes_input_v1]
include = [
  "state.map_frontier",
  "state.map_evidence",
  "state.map_candidate_hints",
  "state.map_request.focus",
  "state.map_result.markdown",
  "state.map_source.normalized_text",
  "policy.map_llm_child_limit",
]

[projections.parse_child_nodes_input_v1]
include = [
  "state.map_candidate.raw_text",
  "state.map_candidate.reason",
  "state.map_evidence.segment_ids",
  "policy.map_node_min_word_letters",
  "policy.map_llm_child_limit",
]

[projections.repair_child_nodes_input_v1]
include = [
  "state.map_candidate.raw_text",
  "state.map_candidate.reason",
  "state.map_candidate.children",
  "state.map_evidence.segment_ids",
  "policy.map_node_min_word_letters",
  "policy.map_llm_child_limit",
]

[projections.validate_child_nodes_input_v1]
include = [
  "state.map_candidate.children",
  "state.map_candidate.reason",
  "state.map_frontier",
  "state.map_evidence",
  "state.map_result.markdown",
  "state.map_source.normalized_text",
  "policy.map_node_min_word_letters",
  "policy.map_llm_child_limit",
]

[projections.attach_child_nodes_input_v1]
include = [
  "state.map_result.markdown",
  "state.map_frontier.node_id",
  "state.map_validation.accepted_children",
  "state.map_result.root_label",
]

[projections.detect_coverage_gaps_input_v1]
include = [
  "state.map_result.markdown",
  "state.map_segments.segments",
  "state.map_focus.top_segments",
  "state.map_coverage.covered_segment_ids",
  "policy.map_gap_fill_enabled",
  "policy.map_gap_limit",
]

[projections.select_gap_target_input_v1]
include = [
  "state.map_gaps.gaps",
  "state.map_metrics.gap_round",
  "policy.map_max_gap_rounds",
]

[projections.propose_gap_fill_input_v1]
include = [
  "state.map_gap",
  "state.map_request.focus",
  "state.map_result.markdown",
  "state.map_source.normalized_text",
  "policy.map_gap_fill_enabled",
  "policy.map_gap_limit",
]

[projections.parse_gap_fill_input_v1]
include = [
  "state.map_candidate.raw_text",
  "state.map_candidate.reason",
  "state.map_gap.segment_ids",
  "policy.map_node_min_word_letters",
  "policy.map_gap_limit",
]

[projections.validate_gap_fill_input_v1]
include = [
  "state.map_candidate.children",
  "state.map_candidate.reason",
  "state.map_gap",
  "state.map_result.markdown",
  "state.map_source.normalized_text",
  "policy.map_node_min_word_letters",
  "policy.map_gap_limit",
]

[projections.attach_gap_fill_input_v1]
include = [
  "state.map_result.markdown",
  "state.map_gap.parent_id",
  "state.map_validation.accepted_nodes",
  "state.map_result.root_label",
]

[projections.validate_candidate_tree_input_v1]
include = [
  "state._candidates.map_result_candidate",
  "state.map_result.root_label",
  "state.map_request.topic",
  "policy.map_min_nodes",
  "policy.map_max_nodes",
  "policy.map_max_edges",
  "policy.map_max_depth",
  "policy.map_require_single_root",
  "policy.map_allow_cycles",
  "policy.map_max_isolated_nodes",
  "policy.map_require_connected_graph",
  "policy.map_node_min_word_letters",
]

[projections.commit_candidate_tree_input_v1]
include = [
  "state.map_validation",
  "state._candidates.map_result_candidate",
  "state.map_metrics",
  "state.map_candidate.intent",
]

[projections.update_coverage_input_v1]
include = [
  "state.map_coverage",
  "state.map_evidence.segment_ids",
  "state.map_gap.segment_ids",
  "state.map_candidate.committed",
  "state.map_candidate.intent",
  "state.map_metrics.expansion_round",
  "state.map_segments.segment_count",
]

[projections.decide_continue_expansion_input_v1]
include = [
  "state.map_result.markdown",
  "state.map_request.target_depth",
  "state.map_metrics.expansion_round",
  "policy.map_max_expansion_rounds",
]

[projections.normalize_labels_input_v1]
include = [
  "state.map_result.markdown",
  "state.map_result.root_label",
  "policy.map_min_nodes",
  "policy.map_max_nodes",
  "policy.map_max_edges",
  "policy.map_max_depth",
  "policy.map_require_single_root",
  "policy.map_allow_cycles",
  "policy.map_max_isolated_nodes",
  "policy.map_require_connected_graph",
  "policy.map_node_min_word_letters",
]

[projections.merge_semantic_duplicates_input_v1]
include = [
  "state.map_result.markdown",
  "state.map_result.root_label",
  "policy.map_min_nodes",
  "policy.map_max_nodes",
  "policy.map_max_edges",
  "policy.map_max_depth",
  "policy.map_require_single_root",
  "policy.map_allow_cycles",
  "policy.map_max_isolated_nodes",
  "policy.map_require_connected_graph",
  "policy.map_node_min_word_letters",
]

[projections.ensure_single_root_input_v1]
include = ["state.map_result.markdown", "state.map_result.root_label"]

[projections.ensure_connected_tree_input_v1]
include = ["state.map_result.markdown", "state.map_result.root_label"]

[projections.validate_final_tree_input_v1]
include = [
  "state.map_result.markdown",
  "state.map_result.root_label",
  "state.map_request.topic",
  "policy.map_min_nodes",
  "policy.map_max_nodes",
  "policy.map_max_edges",
  "policy.map_max_depth",
  "policy.map_require_single_root",
  "policy.map_allow_cycles",
  "policy.map_max_isolated_nodes",
  "policy.map_require_connected_graph",
  "policy.map_node_min_word_letters",
]

[projections.render_markdown_input_v1]
include = ["state.map_result"]

[projections.emit_result_input_v1]
include = ["state.map_result", "state.map_validation"]

[[steps]]
id = "resolve_request"
runner = "map.resolve_request.v1"
input_projection = "resolve_request_input_v1"
write_to = "map_request"
on_error = "continue_with_defaults"

[[steps]]
id = "collect_context"
runner = "map.collect_context.v1"
input_projection = "collect_context_input_v1"
write_to = "map_source"
on_error = "continue_with_defaults"

[[steps]]
id = "normalize_context"
runner = "map.normalize_context.v1"
input_projection = "normalize_context_input_v1"
write_to = "map_source"
on_error = "continue_with_defaults"

[[steps]]
id = "segment_context"
runner = "map.segment_context.v1"
input_projection = "segment_context_input_v1"
write_to = "map_segments"
on_error = "continue_with_defaults"

[[steps]]
id = "extract_outline"
runner = "map.extract_outline.v1"
input_projection = "extract_outline_input_v1"
write_to = "map_outline"
on_error = "continue_with_defaults"

[[steps]]
id = "score_focus_sections"
runner = "map.score_focus_sections.v1"
input_projection = "score_focus_sections_input_v1"
write_to = "map_focus"
on_error = "continue_with_defaults"

[[steps]]
id = "choose_root_label"
runner = "map.choose_root_label.v1"
input_projection = "choose_root_label_input_v1"
write_to = "map_seed"
on_error = "continue_with_defaults"

[[steps]]
id = "seed_from_outline"
runner = "map.seed_from_outline.v1"
input_projection = "seed_from_outline_input_v1"
write_to = "map_result"
on_error = "continue_with_defaults"

[[steps]]
id = "extract_seed_concepts"
runner = "map.extract_seed_concepts.v1"
input_projection = "extract_seed_concepts_input_v1"
write_to = "map_seed_concepts"
on_error = "continue_with_defaults"

[[steps]]
id = "propose_seed_enrichment"
runner = "map.propose_seed_enrichment.v1"
input_projection = "propose_seed_enrichment_input_v1"
write_to = "map_seed_enrichment"
on_error = "continue_with_defaults"
max_visits = 6
on_max_visits = "commit_initial_tree"

[[steps]]
id = "parse_seed_enrichment"
runner = "map.parse_seed_enrichment.v1"
input_projection = "parse_seed_enrichment_input_v1"
write_to = "map_seed_enrichment"
on_error = "continue_with_defaults"
max_visits = 6
on_max_visits = "commit_initial_tree"

[[steps]]
id = "validate_seed_enrichment"
runner = "map.validate_seed_enrichment.v1"
input_projection = "validate_seed_enrichment_input_v1"
write_to = "map_validation"
on_error = "continue_with_defaults"

[[steps]]
id = "commit_initial_tree"
runner = "map.commit_initial_tree.v1"
input_projection = "commit_initial_tree_input_v1"
write_to = "map_result"
on_error = "continue_with_defaults"

[[steps]]
id = "select_frontier_node"
runner = "map.select_frontier_node.v1"
input_projection = "select_frontier_node_input_v1"
write_to = "map_frontier"
on_error = "continue_with_defaults"
max_visits = 96
on_max_visits = "detect_coverage_gaps"

[[steps]]
id = "collect_frontier_evidence"
runner = "map.collect_frontier_evidence.v1"
input_projection = "collect_frontier_evidence_input_v1"
write_to = "map_evidence"
on_error = "continue_with_defaults"

[[steps]]
id = "extract_local_candidates"
runner = "map.extract_local_candidates.v1"
input_projection = "extract_local_candidates_input_v1"
write_to = "map_candidate_hints"
on_error = "continue_with_defaults"

[[steps]]
id = "propose_child_nodes"
runner = "map.propose_child_nodes.v1"
input_projection = "propose_child_nodes_input_v1"
write_to = "map_candidate"
on_error = "continue_with_defaults"
max_visits = 48
on_max_visits = "decide_continue_expansion"

[[steps]]
id = "parse_child_nodes"
runner = "map.parse_child_nodes.v1"
input_projection = "parse_child_nodes_input_v1"
write_to = "map_candidate"
on_error = "continue_with_defaults"
max_visits = 48
on_max_visits = "decide_continue_expansion"

[[steps]]
id = "repair_child_nodes"
runner = "map.repair_child_nodes.v1"
input_projection = "repair_child_nodes_input_v1"
write_to = "map_candidate"
on_error = "continue_with_defaults"
max_visits = 48
on_max_visits = "decide_continue_expansion"

[[steps]]
id = "validate_child_nodes"
runner = "map.validate_child_nodes.v1"
input_projection = "validate_child_nodes_input_v1"
write_to = "map_validation"
on_error = "continue_with_defaults"

[[steps]]
id = "attach_child_nodes"
runner = "map.attach_child_nodes.v1"
input_projection = "attach_child_nodes_input_v1"
write_to = "map_candidate"
on_error = "continue_with_defaults"

[[steps]]
id = "detect_coverage_gaps"
runner = "map.detect_coverage_gaps.v1"
input_projection = "detect_coverage_gaps_input_v1"
write_to = "map_gaps"
on_error = "continue_with_defaults"
max_visits = 32
on_max_visits = "normalize_labels"

[[steps]]
id = "select_gap_target"
runner = "map.select_gap_target.v1"
input_projection = "select_gap_target_input_v1"
write_to = "map_gap"
on_error = "continue_with_defaults"
max_visits = 32
on_max_visits = "normalize_labels"

[[steps]]
id = "propose_gap_fill"
runner = "map.propose_gap_fill.v1"
input_projection = "propose_gap_fill_input_v1"
write_to = "map_candidate"
on_error = "continue_with_defaults"
max_visits = 24
on_max_visits = "detect_coverage_gaps"

[[steps]]
id = "parse_gap_fill"
runner = "map.parse_gap_fill.v1"
input_projection = "parse_gap_fill_input_v1"
write_to = "map_candidate"
on_error = "continue_with_defaults"
max_visits = 24
on_max_visits = "detect_coverage_gaps"

[[steps]]
id = "validate_gap_fill"
runner = "map.validate_gap_fill.v1"
input_projection = "validate_gap_fill_input_v1"
write_to = "map_validation"
on_error = "continue_with_defaults"

[[steps]]
id = "attach_gap_fill"
runner = "map.attach_gap_fill.v1"
input_projection = "attach_gap_fill_input_v1"
write_to = "map_candidate"
on_error = "continue_with_defaults"

[[steps]]
id = "validate_candidate_tree"
runner = "map.validate_candidate_tree.v1"
input_projection = "validate_candidate_tree_input_v1"
write_to = "map_validation"
on_error = "continue_with_defaults"
max_visits = 64
on_max_visits = "normalize_labels"

[[steps]]
id = "commit_candidate_tree"
runner = "map.commit_candidate_tree.v1"
input_projection = "commit_candidate_tree_input_v1"
write_to = "map_candidate"
on_error = "continue_with_defaults"

[[steps]]
id = "update_coverage"
runner = "map.update_coverage.v1"
input_projection = "update_coverage_input_v1"
write_to = "map_coverage"
on_error = "continue_with_defaults"

[[steps]]
id = "decide_continue_expansion"
runner = "map.decide_continue_expansion.v1"
input_projection = "decide_continue_expansion_input_v1"
write_to = "map_frontier"
on_error = "continue_with_defaults"

[[steps]]
id = "normalize_labels"
runner = "map.normalize_labels.v1"
input_projection = "normalize_labels_input_v1"
write_to = "map_result"
on_error = "continue_with_defaults"

[[steps]]
id = "merge_semantic_duplicates"
runner = "map.merge_semantic_duplicates.v1"
input_projection = "merge_semantic_duplicates_input_v1"
write_to = "map_result"
on_error = "continue_with_defaults"

[[steps]]
id = "ensure_single_root"
runner = "map.ensure_single_root.v1"
input_projection = "ensure_single_root_input_v1"
write_to = "map_result"
on_error = "continue_with_defaults"

[[steps]]
id = "ensure_connected_tree"
runner = "map.ensure_connected_tree.v1"
input_projection = "ensure_connected_tree_input_v1"
write_to = "map_result"
on_error = "continue_with_defaults"

[[steps]]
id = "validate_final_tree"
runner = "map.validate_final_tree.v1"
input_projection = "validate_final_tree_input_v1"
write_to = "map_validation"
on_error = "continue_with_defaults"

[[steps]]
id = "render_markdown"
runner = "map.render_markdown.v1"
input_projection = "render_markdown_input_v1"
write_to = "map_result"
on_error = "continue_with_defaults"

[[steps]]
id = "emit_result"
runner = "map.emit_result.v1"
input_projection = "emit_result_input_v1"

[[steps]]
id = "fail_hard"
runner = "control.fail.v1"
args = { code = "MINDMAP_WORKFLOW_FAILED", message = "Mindmap workflow could not produce a valid result." }

[[edges]]
from = "resolve_request"
to = "collect_context"

[[edges]]
from = "collect_context"
to = "normalize_context"

[[edges]]
from = "normalize_context"
to = "segment_context"

[[edges]]
from = "segment_context"
to = "extract_outline"

[[edges]]
from = "extract_outline"
to = "score_focus_sections"

[[edges]]
from = "score_focus_sections"
to = "choose_root_label"

[[edges]]
from = "choose_root_label"
to = "seed_from_outline"

[[edges]]
from = "seed_from_outline"
to = "extract_seed_concepts"

[[edges]]
from = "extract_seed_concepts"
to = "propose_seed_enrichment"

[[edges]]
from = "propose_seed_enrichment"
to = "parse_seed_enrichment"

[[edges]]
from = "parse_seed_enrichment"
to = "validate_seed_enrichment"

[[edges]]
from = "validate_seed_enrichment"
to = "commit_initial_tree"

[[edges]]
from = "commit_initial_tree"
to = "select_frontier_node"

[[edges]]
from = "select_frontier_node"
to = "collect_frontier_evidence"
when = "state.map_frontier.selected == true"

[[edges]]
from = "select_frontier_node"
to = "detect_coverage_gaps"
when = "state.map_frontier.selected != true"

[[edges]]
from = "collect_frontier_evidence"
to = "extract_local_candidates"

[[edges]]
from = "extract_local_candidates"
to = "propose_child_nodes"

[[edges]]
from = "propose_child_nodes"
to = "parse_child_nodes"

[[edges]]
from = "parse_child_nodes"
to = "repair_child_nodes"
when = "state.map_candidate.reason == 'invalid_response_format'"

[[edges]]
from = "parse_child_nodes"
to = "validate_child_nodes"
when = "state.map_candidate.reason != 'invalid_response_format'"

[[edges]]
from = "repair_child_nodes"
to = "validate_child_nodes"

[[edges]]
from = "validate_child_nodes"
to = "attach_child_nodes"
when = "state.map_validation.ok == true"

[[edges]]
from = "validate_child_nodes"
to = "decide_continue_expansion"
when = "state.map_validation.ok != true"

[[edges]]
from = "attach_child_nodes"
to = "validate_candidate_tree"

[[edges]]
from = "detect_coverage_gaps"
to = "select_gap_target"
when = "state.map_gaps.found == true"

[[edges]]
from = "detect_coverage_gaps"
to = "normalize_labels"
when = "state.map_gaps.found != true"

[[edges]]
from = "select_gap_target"
to = "propose_gap_fill"
when = "state.map_gap.selected == true"

[[edges]]
from = "select_gap_target"
to = "normalize_labels"
when = "state.map_gap.selected != true"

[[edges]]
from = "propose_gap_fill"
to = "parse_gap_fill"

[[edges]]
from = "parse_gap_fill"
to = "validate_gap_fill"

[[edges]]
from = "validate_gap_fill"
to = "attach_gap_fill"
when = "state.map_validation.ok == true"

[[edges]]
from = "validate_gap_fill"
to = "detect_coverage_gaps"
when = "state.map_validation.ok != true"

[[edges]]
from = "attach_gap_fill"
to = "validate_candidate_tree"

[[edges]]
from = "validate_candidate_tree"
to = "commit_candidate_tree"

[[edges]]
from = "commit_candidate_tree"
to = "update_coverage"

[[edges]]
from = "update_coverage"
to = "detect_coverage_gaps"
when = "state.map_candidate.intent == 'gap_fill'"

[[edges]]
from = "update_coverage"
to = "decide_continue_expansion"
when = "state.map_candidate.intent != 'gap_fill'"

[[edges]]
from = "decide_continue_expansion"
to = "select_frontier_node"
when = "state.map_frontier.continue_flag == true"

[[edges]]
from = "decide_continue_expansion"
to = "detect_coverage_gaps"
when = "state.map_frontier.continue_flag != true"

[[edges]]
from = "normalize_labels"
to = "merge_semantic_duplicates"

[[edges]]
from = "merge_semantic_duplicates"
to = "ensure_single_root"

[[edges]]
from = "ensure_single_root"
to = "ensure_connected_tree"

[[edges]]
from = "ensure_connected_tree"
to = "validate_final_tree"

[[edges]]
from = "validate_final_tree"
to = "render_markdown"
when = "state.map_validation.ok == true"

[[edges]]
from = "validate_final_tree"
to = "fail_hard"
when = "state.map_validation.ok != true"

[[edges]]
from = "render_markdown"
to = "emit_result"

[budgets]
max_runtime_seconds = 300
max_llm_calls = 32
max_rag_calls = 0
max_nli_calls = 0

[step_tool_allowlist]
propose_seed_enrichment = ["llm.generate"]
propose_child_nodes = ["llm.generate"]
propose_gap_fill = ["llm.generate"]
emit_result = ["canvas.open_text"]
