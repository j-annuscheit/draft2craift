[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "draft2craift"
version = "1.0.0"
description = "Local-first AI writing studio with LLM-assisted document editing and RAG"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"

dependencies = [
    "PySide6>=6.6.0",
    "networkx>=3.2",
    "llama-cpp-python>=0.2.57",
]

[project.optional-dependencies]
# pip install "draft2craift[full]"
full = [
    "sentence-transformers>=2.7.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "piper-tts>=1.3.0",
    "onnxruntime>=1.17",
    "pathvalidate>=3.2.0",
    "pyttsx3>=2.90",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "html2text>=2020.1.16",
    "python-docx>=1.1.0",
    "markdownify>=0.11.6",
    "odfpy>=1.4.1",
]
# pip install "draft2craift[nli]"
nli = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
]
# pip install "draft2craift[speech]"
speech = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "piper-tts>=1.3.0",
    "onnxruntime>=1.17",
    "pathvalidate>=3.2.0",
]
# pip install "draft2craift[pdf]"  — AGPL-3.0, see THIRD_PARTY_NOTICES.md
pdf = [
    "pymupdf4llm>=0.0.17",
]

[project.scripts]
draft2craift = "main:main"

[tool.hatch.build.targets.wheel]
# Include all source files at the package root
include = [
    "main.py",
    "core/**/*.py",
    "services/**/*.py",
    "features/**/*.py",
    "shell/**/*.py",
    "widgets/**/*.py",
    "prompts/**",
]

[tool.hatch.build.targets.wheel.sources]
# Install files directly into the package namespace
"." = "draft2craift"
